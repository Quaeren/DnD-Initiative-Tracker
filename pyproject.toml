[project]
name = "dnd-tracker"
version = "0.1.0"
description = "A simple command line based initiative tracker for ttrpgs"
authors = [
    {name = "Quaeren",email = "ldwagenvoort@hotmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "typer (>=0.26.8,<0.27.0)",
    "rich (>=15.0.0,<16.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.15.21,<0.16.0)",
    "mypy (>=2.2.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
