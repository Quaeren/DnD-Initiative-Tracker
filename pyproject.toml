[project]
name = "initiative-tracker"
version = "0.1.0"
description = "A simple cli based initiative tracker for dnd or other ttrpgs"
authors = [
    {name = "Quaeren",email = "ldwagenvoort@hotmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "questionary (>=2.1.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
